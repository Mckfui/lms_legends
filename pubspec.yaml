name: lsm_legends
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  get: ^4.7.3
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.1
  google_fonts: ^6.2.1
  http: ^1.2.1
  shared_preferences: ^2.3.2
  video_player: ^2.8.2
  chewie: ^1.7.5
  flutter_staggered_grid_view: ^0.7.0
  flutter_svg: ^2.0.10+1
  carousel_slider: ^5.0.0
  lottie: ^3.1.2
  page_view_dot_indicator: ^2.2.0

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter

flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/videos/
    - assets/svg/
    - assets/json/
    - assets/mock/
